<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<title>Our Family Board</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: #fff6ea; color: #2b2622;
    font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; }
  button { cursor: pointer; border: 0; border-radius: 16px; padding: .6rem 1.1rem; background: #2b2622; color: #fff; font-weight: 700; }
  button.ghost { background: #f1e6d8; color: #2b2622; }
  input, select { padding: .7rem .9rem; border: 2px solid #e2d4c2; border-radius: 14px; background: #fff; min-width: 0; }
  [hidden] { display: none !important; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1.2rem; padding: .6rem 1.4rem .4rem; }
  #clock { white-space: nowrap; font-size: clamp(2.4rem, 5vw, 3.6rem); font-weight: 800; letter-spacing: -.02em; }
  #date { font-size: clamp(1.2rem, 2.4vw, 1.8rem); font-weight: 600; color: #7a6b5d; }
  header .right { margin-left: auto; display: flex; gap: .6rem; align-items: center; color: #9a8b7d; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 1rem; padding: 0 1rem 1rem; }
  #kids { display: contents; }
  .side { display: grid; grid-template-rows: 1.2fr 1fr; gap: 1rem; min-height: 0; }
  .card { background: #fff; border-radius: 26px; padding: 1rem 1.1rem; box-shadow: 0 2px 10px #0000000d; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .card h2 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 2.8vw, 2rem); display: flex; align-items: center; gap: .5rem; }
  .card h2 .add { margin-left: auto; font-size: 1.6rem; width: 3.2rem; height: 3.2rem; padding: 0; border-radius: 50%; }

  .kid { border-top: 10px solid var(--c); }
  .kid .emoji { font-size: 1.4em; }
  .kid .count { margin-left: auto; background: var(--c); color: #fff; border-radius: 99px; padding: .1rem .8rem; font-size: .8em; text-shadow: 0 1px 2px #0005; }
  .tasks { flex: 1; display: flex; flex-direction: column; gap: .5rem; }
  .task { flex: 1; min-height: 42px; max-height: 96px; display: flex; align-items: center; gap: .6rem; text-align: left;
    font-size: clamp(1.25rem, 2.4vw, 1.8rem); background: #fff; color: #2b2622; border: 3px solid var(--c); border-radius: 20px; }
  .task.done { background: color-mix(in srgb, var(--c) 28%, #fff); }
  .task.done span { text-decoration: line-through; opacity: .6; }
  .cheer { text-align: center; font-size: 1.6rem; font-weight: 800; margin-top: .6rem; }
  .empty { color: #a99a8b; font-size: 1.2rem; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
  li { display: flex; align-items: center; gap: .7rem; font-size: clamp(1.1rem, 2vw, 1.4rem); padding: .55rem .8rem; border-radius: 16px; background: #faf4ec; }
  li.today { background: #ffe9c7; }
  li .when { font-weight: 800; white-space: nowrap; }
  li .who { margin-left: auto; white-space: nowrap; font-size: .85em; padding: .1rem .6rem; border-radius: 99px; color: #fff; background: var(--c, #8a7a6a); }
  li .x, .x { display: none; background: none; color: #c0392b; padding: .2rem .5rem; font-size: 1.3rem; }
  body.parent li .x, .settings .x { display: inline-block; }

  /* 폰·세로 화면: 한 줄로 쌓고 스크롤 */
  @media (max-width: 820px), (orientation: portrait) {
    body { height: auto; min-height: 100dvh; }
    main { grid-template-columns: 1fr; }
    .side { grid-template-rows: auto; }
    .task { flex: none; }
  }

  #gate { flex: 1; display: grid; place-items: center; padding: 1rem; }
  #gate form { width: min(440px, 100%); gap: .8rem; }
  #gate h1 { margin: 0; font-size: 2rem; }
  .roles { display: flex; gap: .6rem; }
  .roles label { flex: 1; padding: .7rem; border: 2px solid #e2d4c2; border-radius: 14px; text-align: center; font-weight: 600; }
  .roles label:has(input:checked) { border-color: #2b2622; background: #f1e6d8; }
  .roles input { display: none; }

  dialog { border: 0; border-radius: 24px; padding: 1.2rem; width: min(560px, 94vw); box-shadow: 0 10px 40px #0004; }
  dialog::backdrop { background: #0006; }
  dialog form, .col { display: flex; flex-direction: column; gap: .7rem; }
  dialog h3 { margin: 0; font-size: 1.5rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row > input:not([type=color]) { flex: 1; }
  .settings section { border: 2px solid #f1e6d8; border-radius: 18px; padding: .8rem; }
  .settings h4 { margin: 0 0 .5rem; font-size: 1.2rem; }
  input[type=color] { width: 3.2rem; height: 3rem; padding: .2rem; }
</style>
</head>
<body>

<div id="gate" hidden>
  <form id="gateForm" class="card">
    <div class="row"><h1 data-i="title"></h1><button type="button" class="ghost" data-lang style="margin-left:auto"></button></div>
    <p id="gateMsg"></p>
    <input name="name" data-ip="namePh" maxlength="20" required>
    <input name="pin" type="password" inputmode="numeric" pattern="\d{4,8}" data-ip="pinPh" required autocomplete="off">
    <div class="roles" id="roles">
      <label><input type="radio" name="role" value="family" checked><span data-i="roleFamily"></span></label>
      <label><input type="radio" name="role" value="parent"><span data-i="roleParent"></span></label>
    </div>
    <button data-i="start"></button>
  </form>
</div>

<div id="board" hidden style="display:contents">
  <header>
    <div id="clock"></div><div id="date"></div>
    <div class="right"><span id="devName"></span><button class="ghost" data-lang></button><button class="ghost" id="openSettings" data-i="settings" hidden></button></div>
  </header>
  <main>
    <div id="kids"></div>
    <div class="side">
      <section class="card"><h2><span data-i="events"></span> <button class="add" data-open="eventDlg">＋</button></h2><ul id="events"></ul></section>
      <section class="card"><h2><span data-i="memos"></span> <button class="add" data-open="memoDlg">＋</button></h2><ul id="memos"></ul></section>
    </div>
  </main>
</div>

<dialog id="eventDlg"><form data-act="addEvent">
  <h3 data-i="addEvent"></h3>
  <input name="title" data-ip="eventPh" maxlength="60" required>
  <div class="row"><input name="date" type="date" required><input name="time" type="time"></div>
  <select name="who" class="whoSel"></select>
  <div class="row"><button data-i="add"></button><button type="button" class="ghost" data-close data-i="cancel"></button></div>
</form></dialog>

<dialog id="memoDlg"><form data-act="addMemo">
  <h3 data-i="addMemo"></h3>
  <input name="text" data-ip="memoPh" maxlength="200" required>
  <select name="who" class="whoSel"></select>
  <div class="row"><button data-i="post"></button><button type="button" class="ghost" data-close data-i="cancel"></button></div>
</form></dialog>

<dialog id="settingsDlg"><div class="col settings">
  <div class="row"><h3 data-i="settingsTitle"></h3><button type="button" class="ghost" data-close style="margin-left:auto" data-i="close"></button></div>
  <div id="settingsBody" class="col"></div>
</div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
let S = null, day = today(), poll = null;
// ---------- 언어 (기기마다 따로 기억) ----------
const L = {
  ko: { locale: 'ko-KR', other: 'English', title: '🏠 우리 가족 보드', namePh: '이 기기 이름 (예: 거실 태블릿, 엄마 폰)', pinPh: '부모 PIN (숫자 4~8자리)',
    roleFamily: '👨‍👩‍👧‍👦 가족 화면', roleParent: '🔑 부모 기기', start: '시작하기', settings: '⚙️ 설정', events: '📅 다가오는 일정', memos: '💬 메모',
    addEvent: '📅 일정 추가', eventPh: '무엇을? (예: 태권도)', add: '추가', cancel: '취소', addMemo: '💬 메모 남기기', memoPh: '하고 싶은 말', post: '남기기',
    settingsTitle: '⚙️ 설정 (부모)', close: '닫기', setupMsg: '처음 오셨네요! 부모 PIN을 만들어 주세요. 이 기기는 부모 기기로 등록돼요.',
    registerMsg: '이 기기를 등록하려면 부모 PIN을 입력하세요.', today: '오늘', tomorrow: '내일', noTasks: '오늘 할 일이 없어요', cheer: '🎉 다 했어요! 최고!',
    noEvents: '일정이 없어요', noMemos: '메모가 없어요', save: '저장', taskPh: '매일 할 일 추가 (최대 8개)', devices: '📱 등록된 기기', thisDevice: '(이 기기)',
    unregister: '해제', confirmDel: '삭제할까요?', confirmTask: '이 할 일을 지울까요?', confirmDev: '이 기기의 등록을 해제할까요?', mom: '엄마', dad: '아빠', family: '가족',
    e_already_setup: '이미 설정됐어요', e_setup_first: '먼저 설정하세요', e_locked: 'PIN을 여러 번 틀렸어요. 5분 후 다시 시도하세요', e_wrong_pin: 'PIN이 틀렸어요',
    e_parent_only: '부모만 할 수 있어요', e_conflict: '동시에 바뀌었어요. 다시 해 주세요', e_bad_request: '입력을 확인해 주세요', e_no_db: '서버에 Firebase가 연결되지 않았어요', e_server_error: '오류가 났어요' },
  en: { locale: 'en-US', other: '한국어', title: '🏠 Our Family Board', namePh: "Device name (e.g. Living room tablet, Mom's phone)", pinPh: 'Parent PIN (4–8 digits)',
    roleFamily: '👨‍👩‍👧‍👦 Family screen', roleParent: '🔑 Parent device', start: 'Start', settings: '⚙️ Settings', events: '📅 Upcoming', memos: '💬 Notes',
    addEvent: '📅 Add event', eventPh: 'What? (e.g. Soccer practice)', add: 'Add', cancel: 'Cancel', addMemo: '💬 Leave a note', memoPh: 'Your message', post: 'Post',
    settingsTitle: '⚙️ Settings (parents)', close: 'Close', setupMsg: 'Welcome! Create a parent PIN. This device will be registered as a parent device.',
    registerMsg: 'Enter the parent PIN to register this device.', today: 'Today', tomorrow: 'Tomorrow', noTasks: 'Nothing to do today', cheer: '🎉 All done! Great job!',
    noEvents: 'No events', noMemos: 'No notes', save: 'Save', taskPh: 'Add a daily task (max 8)', devices: '📱 Registered devices', thisDevice: '(this device)',
    unregister: 'Remove', confirmDel: 'Delete this?', confirmTask: 'Delete this task?', confirmDev: 'Remove this device?', mom: 'Mom', dad: 'Dad', family: 'Family',
    e_already_setup: 'Already set up', e_setup_first: 'Set up first', e_locked: 'Too many wrong PINs. Try again in 5 minutes', e_wrong_pin: 'Wrong PIN',
    e_parent_only: 'Parents only', e_conflict: 'Changed at the same time. Please try again', e_bad_request: 'Please check your input', e_no_db: 'Firebase is not connected on the server', e_server_error: 'Something went wrong' },
};
let lang = 'en'; // 기본 영어, 기기에서 바꾸면 그 기기에 기억
try { lang = localStorage.getItem('lang') || 'en'; } catch {}
if (!L[lang]) lang = 'en';
const t = (k) => L[lang][k] ?? k;
function applyLang() {
  document.documentElement.lang = lang; document.title = t('title').replace(/^\S+\s/, '');
  document.querySelectorAll('[data-i]').forEach((el) => el.textContent = t(el.dataset.i));
  document.querySelectorAll('[data-ip]').forEach((el) => el.placeholder = t(el.dataset.ip));
  document.querySelectorAll('[data-lang]').forEach((el) => el.textContent = '🌐 ' + t('other'));
  tick();
  if (S) { render(); if ($('#settingsDlg').open) renderSettings(); }
}

const POLL_MS = 10000; // 다른 기기 변경을 확인하는 간격 (짧을수록 빠르지만 데이터 사용량↑)

async function api(url, data) {
  const r = await fetch(url, data ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : {});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { boot(); throw new Error('unregistered'); }
  if (!r.ok) { if (data) alert(L[lang]['e_' + j.error] || t('e_server_error')); throw new Error(j.error); } // 자동 새로고침 실패는 조용히
  return j;
}
const act = (type, data) => api('/api?r=action', { type, ...data }).then(load);

// ---------- 시작: 등록 확인 ----------
let gateMode;
async function boot() {
  const me = await (await fetch('/api?r=me')).json();
  if (me.device) return start();
  clearInterval(poll); S = null;
  $('#board').hidden = true; $('#gate').hidden = false;
  gateMode = me.setup ? 'register' : 'setup';
  $('#roles').hidden = gateMode === 'setup';
  $('#gateMsg').dataset.i = gateMode === 'setup' ? 'setupMsg' : 'registerMsg';
  applyLang();
}
$('#gateForm').onsubmit = async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  await api('/api?r=' + gateMode, f).catch(() => {});
  e.target.pin.value = '';
  boot();
};

function start() {
  $('#gate').hidden = true; $('#board').hidden = false;
  clearInterval(poll);
  poll = setInterval(() => { if (!document.hidden) load().catch(() => {}); }, POLL_MS); // 다른 기기 변경 반영
  load();
  navigator.wakeLock?.request('screen').catch(() => {});
}
async function load() { S = await api('/api?r=state'); render(); }

// ---------- 그리기 ----------
const kidColor = (name) => S.kids.find((k) => k.name === name)?.color;
const whoList = () => [t('mom'), t('dad'), ...S.kids.map((k) => k.name), t('family')];
function dayLabel(d) {
  const n = new Date(); const tm = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
  if (d === today()) return t('today');
  if (d === ymd(tm)) return t('tomorrow');
  const x = new Date(d + 'T00:00');
  return x.toLocaleDateString(t('locale'), { month: 'numeric', day: 'numeric', weekday: 'short' });
}

function render() {
  const td = today(), parent = S.me.role === 'parent';
  document.body.classList.toggle('parent', parent);
  $('#openSettings').hidden = !parent;
  $('#devName').textContent = S.me.name;

  $('#kids').innerHTML = S.kids.map((k) => {
    const done = k.tasks.filter((x) => x.doneOn === td).length;
    return `<section class="card kid" style="--c:${k.color}">
      <h2><span class="emoji">${esc(k.emoji)}</span>${esc(k.name)}<span class="count">${done}/${k.tasks.length}</span></h2>
      <div class="tasks">${k.tasks.map((x) => `<button class="task ${x.doneOn === td ? 'done' : ''}" data-toggle="${k.id}:${x.id}">
        ${x.doneOn === td ? '✅' : '⬜️'} <span>${esc(x.text)}</span></button>`).join('') || `<p class="empty">${t('noTasks')}</p>`}</div>
      ${k.tasks.length && done === k.tasks.length ? `<div class="cheer">${t('cheer')}</div>` : ''}
    </section>`;
  }).join('');

  const ev = S.events.filter((e) => e.date >= td).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).slice(0, 10);
  $('#events').innerHTML = ev.map((e) => `<li class="${e.date === td ? 'today' : ''}">
    <span class="when">${dayLabel(e.date)} ${e.time}</span><span>${esc(e.title)}</span>
    <span class="who" style="--c:${kidColor(e.who) || '#8a7a6a'}">${esc(e.who)}</span>
    <button class="x" data-del="delEvent:${e.id}">✕</button></li>`).join('') || `<p class="empty">${t('noEvents')}</p>`;

  $('#memos').innerHTML = S.memos.map((m) => `<li><span>${esc(m.text)}</span>
    <span class="who" style="--c:${kidColor(m.who) || '#8a7a6a'}">${esc(m.who)}</span>
    <button class="x" data-del="delMemo:${m.id}">✕</button></li>`).join('') || `<p class="empty">${t('noMemos')}</p>`;
}

function renderSettings() {
  $('#settingsBody').innerHTML = S.kids.map((k) => `<section>
    <form class="row" data-kid="${k.id}">
      <input name="emoji" value="${esc(k.emoji)}" maxlength="8" style="flex:0 0 4.5rem;text-align:center" required>
      <input name="name" value="${esc(k.name)}" maxlength="12" required>
      <input name="color" type="color" value="${k.color}">
      <button>${t('save')}</button>
    </form>
    <ul style="margin:.6rem 0">${k.tasks.map((x) => `<li>${esc(x.text)}<button class="x" style="margin-left:auto" data-deltask="${k.id}:${x.id}">🗑</button></li>`).join('')}</ul>
    <form class="row" data-addtask="${k.id}"><input name="text" placeholder="${t('taskPh')}" maxlength="30" required><button>${t('add')}</button></form>
  </section>`).join('') + `<section><h4>${t('devices')}</h4><ul>${S.devices.map((d) => `<li>
    ${d.role === 'parent' ? '🔑' : '🖥️'} ${esc(d.name)} ${d.me ? t('thisDevice') : ''}
    ${d.me ? '' : `<button class="x" style="margin-left:auto" data-deldev="${d.id}">${t('unregister')}</button>`}</li>`).join('')}</ul></section>`;
}

// ---------- 터치 ----------
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.toggle) { const [kidId, taskId] = d.toggle.split(':'); act('toggle', { kidId, taskId, date: today() }); }
  if (d.del) { const [type, id] = d.del.split(':'); if (confirm(t('confirmDel'))) act(type, { id }); }
  if (d.open) {
    const dlg = $('#' + d.open);
    dlg.querySelectorAll('.whoSel').forEach((s) => s.innerHTML = whoList().map((w) => `<option>${esc(w)}</option>`).join(''));
    if (dlg.querySelector('[name=date]')) dlg.querySelector('[name=date]').value = today();
    dlg.showModal();
  }
  if (d.close !== undefined) b.closest('dialog').close();
  if (d.lang !== undefined) { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('lang', lang); } catch {} applyLang(); }
  if (b.id === 'openSettings') { renderSettings(); $('#settingsDlg').showModal(); }
  if (d.deltask) { const [kidId, taskId] = d.deltask.split(':'); if (confirm(t('confirmTask'))) await act('delTask', { kidId, taskId }); renderSettings(); }
  if (d.deldev && confirm(t('confirmDev'))) { await act('delDevice', { id: d.deldev }); renderSettings(); }
});
document.addEventListener('submit', async (e) => {
  const f = e.target, v = Object.fromEntries(new FormData(f));
  if (f.dataset.act) { e.preventDefault(); await act(f.dataset.act, v); f.reset(); f.closest('dialog').close(); }
  if (f.dataset.kid) { e.preventDefault(); await act('saveKid', { id: f.dataset.kid, ...v }); renderSettings(); }
  if (f.dataset.addtask) { e.preventDefault(); await act('addTask', { kidId: f.dataset.addtask, ...v }); renderSettings(); }
});

// ---------- 시계 + 자정에 할 일 초기화 ----------
function tick() {
  const n = new Date();
  $('#clock').textContent = n.toLocaleTimeString(t('locale'), { hour: 'numeric', minute: '2-digit' });
  $('#date').textContent = n.toLocaleDateString(t('locale'), { month: 'long', day: 'numeric', weekday: 'long' });
  if (S && day !== today()) { day = today(); render(); }
}
setInterval(tick, 5000); applyLang();
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) load().catch(() => {}); });
boot();
</script>
</body>
</html>
