<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFDE59">
<link rel="manifest" href="/manifest.json">
<title>Our Family Board</title>
<style>
  /* 낮: 노랑 · 밤(저녁 7시~아침 6시): 남색 */
  :root { --bg: #FFDE59; --card: #fff; --ink: #1A1A1A; --gray: #5C5850; --mute: #9A9282; --line: rgba(26,26,26,.12); --soft: #FFF3B8; --cream: #FFF9E6;
    --track: #F1EBD6; --btn: #1A1A1A; --btntx: #fff; --home: #DDF3DE; --homeTx: #1F6B2E; --shadow: 0 3px 0 rgba(0,0,0,.06), 0 10px 24px rgba(120,90,0,.08); }
  body.night { --bg: #121327; --card: #1D1F3B; --ink: #F5F1E3; --gray: #BDB8A8; --mute: #8C88A0; --line: rgba(255,255,255,.14); --soft: #3A3519; --cream: #26284A;
    --track: #2E3054; --btn: #FFDE59; --btntx: #1A1A1A; --home: #1F3A2A; --homeTx: #9BE3A8; --shadow: 0 3px 0 rgba(0,0,0,.3); }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); transition: background .6s;
    font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; border: 0; border-radius: 16px; padding: .6rem 1.1rem; background: var(--btn); color: var(--btntx); font-weight: 800; }
  button.ghost { background: var(--cream); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  input, select, textarea { padding: .7rem .9rem; border: 2px solid var(--line); border-radius: 14px; background: var(--cream); color: var(--ink); min-width: 0; }
  textarea { min-height: 5rem; resize: vertical; }
  [hidden] { display: none !important; }

  /* 위: 왼쪽에 날짜·시간 크게 | 오른쪽 위 작은 상태줄 한 줄, 그 아래 날씨 */
  header { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "when right" "when wx"; column-gap: 1.4rem; row-gap: .2rem; padding: .4rem 1.2rem .5rem; align-items: center; }
  .when { grid-area: when; line-height: 1; }
  #date { font-size: clamp(1.3rem, 2.6vw, 2rem); font-weight: 800; color: var(--gray); white-space: nowrap; }
  #clock { white-space: nowrap; font-size: clamp(3rem, 6.4vw, 5rem); font-weight: 900; letter-spacing: -.03em; margin-top: .15rem; }
  #wx { grid-area: wx; }
  header .right { grid-area: right; justify-self: end; display: flex; flex-wrap: nowrap; gap: .4rem; align-items: center; color: var(--mute); font-size: .85rem; white-space: nowrap; overflow: hidden; max-width: 100%; }
  header .right button { padding: .25rem .7rem; border-radius: 12px; font-size: .9rem; }
  header .right #mePick { display: flex; gap: .3rem; align-items: center; }
  #openMail { font-weight: 800; }
  /* 날씨 */
  #wx { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
  #wx:empty { display: none; }
  .wrow { display: flex; align-items: center; gap: .8rem; min-width: 0; }
  .wnow { font-size: clamp(1.6rem, 3.2vw, 2.4rem); font-weight: 900; white-space: nowrap; }
  .wmm { font-weight: 800; white-space: nowrap; color: var(--gray); }
  .whours { display: flex; gap: .35rem; overflow: hidden; min-width: 0; }
  .wh { display: flex; flex-direction: column; align-items: center; font-size: .85rem; font-weight: 700; padding: .15rem .35rem; border-radius: 10px; background: var(--card); min-width: 2.9rem; }
  .wh i { font-style: normal; font-size: 1.1rem; }
  .wh small { color: #2e7ad1; font-size: .7rem; }
  .dust { padding: .1rem .6rem; border-radius: 99px; background: var(--c); color: #fff; font-weight: 800; white-space: nowrap; font-size: .95rem; }
  .tip { font-weight: 700; font-size: clamp(.95rem, 1.6vw, 1.15rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; min-width: 1.6em; margin-left: .4em; padding: 0 .45em; border-radius: 99px; background: #e74c3c; color: #fff; font-size: .85em; text-align: center; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr minmax(230px, .6fr); gap: 1rem; padding: 0 1rem 1rem; }
  #kids { display: contents; }
  .side { display: grid; grid-template-rows: 1fr; /* 💬 메모·📌 게시판 칸은 꺼 둠 (저장된 기록은 서버에 그대로) */ gap: 1rem; min-height: 0; }
  .card { background: var(--card); border-radius: 26px; padding: 1rem 1.1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .card h2 { margin: 0 0 .5rem; font-size: clamp(1.3rem, 2.6vw, 1.9rem); display: flex; align-items: center; gap: .5rem; }
  .card h2 .add { margin-left: auto; font-size: 1.6rem; width: 3rem; height: 3rem; padding: 0; border-radius: 50%; flex: none; }
  .card h2 .hist { margin-left: auto; padding: .4rem .7rem; }
  .card h2 .hist ~ .add { margin-left: 0; }
  .parentOnly { display: none !important; }
  body.parent .parentOnly { display: inline-block !important; }

  .kid { border-top: 10px solid var(--c); }
  .kid .emoji { font-size: 1.1em; width: 2.2em; height: 2.2em; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--c) 25%, var(--card)); box-shadow: inset 0 0 0 3px var(--c); flex: none; }
  .card h2, #clock { font-weight: 900; letter-spacing: -.02em; }
  .kid .count { margin-left: auto; background: var(--c); color: #fff; border-radius: 99px; padding: .1rem .8rem; font-size: .8em; text-shadow: 0 1px 2px #0005; }
  .tasks { flex: 1; display: flex; flex-direction: column; gap: .5rem; }
  .task { flex: 1; min-height: 42px; max-height: 96px; display: flex; align-items: center; gap: .6rem; text-align: left;
    font-size: clamp(1.25rem, 2.4vw, 1.8rem); background: var(--card); color: var(--ink); border: 3px solid var(--c); border-radius: 20px; }
  .task.done { background: color-mix(in srgb, var(--c) 28%, var(--card)); }
  .task.done span { text-decoration: line-through; opacity: .6; }
  .deposit { margin-left: auto; background: #2e9e5b; color: #fff; border-radius: 99px; padding: .15rem .8rem; font-size: .8em; white-space: nowrap; }
  .todo { display: flex; flex-direction: column; gap: .4rem; margin: .2rem 0 .6rem; flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .todo.more-below { -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); } /* 아래에 더 있음 */
  .todohead { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: .6rem; font-size: clamp(1.15rem, 2.2vw, 1.5rem); }
  .todohead .rw { font-size: .75em; font-weight: 800; padding: .15rem .6rem; border-radius: 99px; background: var(--cream); white-space: nowrap; }
  .todohead .rw.got { background: var(--home); color: var(--homeTx); }
  .todolist { gap: .3rem; }
  .todolist li { font-size: clamp(1.1rem, 2.1vw, 1.45rem); font-weight: 700; padding: 0; background: var(--cream); }
  .todolist li.more { background: none; }
  .tdo { width: 100%; display: flex; align-items: center; gap: .7rem; text-align: left; background: none; color: var(--ink); font: inherit; padding: .35rem .8rem .35rem .5rem; border-radius: 16px; min-height: 64px; }
  .tdo .ck { font-style: normal; font-size: 2.1rem; line-height: 1; flex: none; width: 2.6rem; text-align: center; } /* 손가락으로 누르기 좋게 큰 체크칸 */
  .tdo:active { background: color-mix(in srgb, var(--c) 25%, var(--cream)); }
  .todolist li.done { background: color-mix(in srgb, var(--c) 15%, var(--cream)); }
  .todolist li .tdo span:not(.ck) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .todolist li.done span { text-decoration: line-through; opacity: .55; }
  .bar { height: 1.6rem; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; transition: width .4s; }
  .big { font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 900; text-align: center; margin: .4rem 0; }
  .bigdone { color: #fff; }
  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
  .tabs .chip { flex: 1; }
  /* 아이별 오늘·내일 일정 */
  .agenda { display: flex; flex-direction: column; gap: .35rem; margin: .3rem 0 0; flex: none; }
  .agenda h3 { margin: 0; font-size: clamp(1.15rem, 2.2vw, 1.5rem); }
  .ag { padding: .4rem .7rem; border-radius: 14px; background: var(--cream); font-size: clamp(1.1rem, 2vw, 1.4rem); font-weight: 700; }
  .ag .tm { margin-right: .4rem; }
  .ag .memo, .cmemo { color: var(--gray); font-weight: 500; font-size: .85em; }
  .ag .prep { font-weight: 700; font-size: .85em; }
  .agenda .ag { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag.off, .ci.off { text-decoration: line-through; opacity: .55; }
  .tag { display: inline-block; font-size: .7em; padding: 0 .45em; border-radius: 8px; background: #e74c3c; color: #fff; margin-left: .3em; text-decoration: none; vertical-align: middle; }
  .tag.mk { background: #2e7ad1; }
  /* 한 달 달력 */
  .calhead { display: flex; align-items: center; gap: .5rem; }
  .calhead h3 { flex: 1; text-align: center; }
  .calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .calgrid .wd { text-align: center; font-weight: 800; font-size: .9rem; color: var(--gray); }
  .cell { min-height: 92px; max-height: 120px; overflow: hidden; padding: 4px; border-radius: 10px; background: var(--cream); text-align: left; color: var(--ink);
    font-weight: 500; display: flex; flex-direction: column; gap: 2px; align-items: stretch; justify-content: flex-start; box-shadow: none; }
  .cell.other { opacity: .35; }
  .cell.today { box-shadow: inset 0 0 0 3px var(--ink); }
  .cell.sel { background: var(--soft); }
  .cell b { font-size: .9rem; }
  .ci { font-size: .72rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 4px solid var(--c, var(--mute)); padding-left: 3px; }
  .cdetail li { display: block; }
  .cdetail .row { margin-top: .3rem; }
  .days { display: flex; gap: .3rem; flex-wrap: wrap; }
  .days .chip { padding: .35rem .6rem; font-size: 1rem; }
  details.cls { border: 2px solid var(--line); border-radius: 14px; padding: .4rem .7rem; }
  details.cls summary { font-weight: 700; cursor: pointer; }
  details.cls form { margin-top: .5rem; }
  .cheer { text-align: center; font-size: 1.6rem; font-weight: 800; margin-top: .6rem; }
  .empty { color: var(--mute); font-size: 1.2rem; margin: .3rem 0; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
  li { display: flex; align-items: center; gap: .7rem; font-size: clamp(1.05rem, 1.9vw, 1.35rem); padding: .55rem .8rem; border-radius: 16px; background: var(--cream); }
  li.today { background: var(--soft); }
  li .when { font-weight: 800; white-space: nowrap; }
  li .who { margin-left: auto; white-space: nowrap; font-size: .85em; padding: .1rem .6rem; border-radius: 99px; color: #fff; background: var(--c, #8a7a6a); }
  li .x, .x { display: none; background: none; color: #c0392b; padding: .2rem .5rem; font-size: 1.3rem; }
  body.parent li .x, .settings .x { display: inline-block; }

  /* 얼굴 버튼 (게시판·우체통) */
  .face { position: relative; width: 3rem; height: 3rem; padding: 0; border-radius: 50%; font-size: 1.6rem; line-height: 1; background: var(--card); color: var(--ink); border: 3px solid var(--c, #8a7a6a); flex: none; }
  .face.done { background: color-mix(in srgb, var(--c) 30%, var(--card)); }
  .face.done::after { content: '✓'; position: absolute; right: -6px; bottom: -6px; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: #2e9e5b; color: #fff; font-size: .85rem; line-height: 1.3rem; }
  .face .dot { position: absolute; top: -3px; right: -3px; width: .85rem; height: .85rem; border-radius: 50%; background: #e74c3c; }
  .face.big { width: auto; height: auto; min-width: 9rem; padding: 1rem 1.4rem; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: .3rem; font-size: 3.2rem; }
  .face.big b { font-size: 1.4rem; }
  .face.big .badge { position: absolute; top: -.5rem; right: -.5rem; font-size: 1.1rem; }
  .faces { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

  /* 오른쪽 칸은 촘촘하게 (태블릿 한 화면) */
  .side .card { padding: .65rem .85rem; }
  .side .card h2 { font-size: clamp(1.1rem, 1.9vw, 1.4rem); margin-bottom: .35rem; }
  .side .card h2 .add { width: 2.3rem; height: 2.3rem; font-size: 1.25rem; }
  .side .card h2 .hist { padding: .2rem .5rem; }
  .side ul { gap: .35rem; }
  .side li.ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .5rem; }
  .side li.ev .when { grid-column: 1 / -1; grid-row: 1; }
  .side li.ev .etitle, .side li.ev .who { grid-row: 2; }
  .side li.ev .etitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side li.ev .who { margin-left: 0; }
  .side .card h2 > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .side li { padding: .3rem .6rem; font-size: clamp(.95rem, 1.55vw, 1.12rem); border-radius: 12px; }
  .side .face { width: 2.4rem; height: 2.4rem; font-size: 1.25rem; }
  .side li.note .box { font-size: 1.1rem; }
  .side .empty { font-size: 1rem; margin: 0; }
  .more { background: none; padding: 0; }
  .more button { width: 100%; padding: .2rem; font-size: .9rem; }
  .agenda .more button { font-size: 1rem; padding: .3rem; }
  li.note { display: grid; grid-template-columns: auto 1fr auto auto; gap: .6rem; padding: .45rem .7rem; }
  li.note .box { font-size: 1.3rem; }
  li.note .ntext { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nmeta { font-size: .8em; color: var(--gray); }
  li.note.over .nmeta { color: #c0392b; font-weight: 700; }
  li.note.future { opacity: .55; }
  .nfaces { display: flex; gap: .45rem; }

  /* 키가 작은 태블릿(1024×600, 브라우저 창 포함 1280×720 등): 버튼은 얇게 */
  @media (max-height: 760px) and (min-width: 821px) and (orientation: landscape) {
    .kid .emoji { width: 1.8em; height: 1.8em; }
  }
  /* 폰·세로 화면: 한 줄로 쌓고 스크롤 */
  @media (max-width: 820px), (orientation: portrait) {
    body { height: auto; min-height: 100dvh; }
    main { grid-template-columns: 1fr; }
    .side { grid-template-rows: auto; }
    .task { flex: none; }
    .mailgrid { grid-template-columns: 1fr !important; }
    .card, .agenda { overflow: visible; }
    .agenda, .todo { flex: none; }
    .todo { overflow: visible; -webkit-mask-image: none; mask-image: none; }
    header { grid-template-columns: minmax(0, 1fr); grid-template-areas: "right" "when" "wx"; }
    header .right { justify-self: stretch; flex-wrap: wrap; white-space: normal; }
  }

  #gate { flex: 1; display: grid; place-items: center; padding: 1rem; }
  #gate form { width: min(440px, 100%); gap: .8rem; }
  #gate h1 { margin: 0; font-size: 2rem; }
  .roles { display: flex; gap: .6rem; }
  .roles label { flex: 1; padding: .7rem; border: 2px solid var(--line); border-radius: 14px; text-align: center; font-weight: 600; }
  .roles label:has(input:checked) { border-color: var(--ink); background: var(--track); }
  .roles input { display: none; }

  dialog { border: 0; border-radius: 24px; padding: 1.2rem; width: min(560px, 94vw); max-height: 92dvh; box-shadow: 0 10px 40px #0004; background: var(--card); color: var(--ink); }
  dialog.wide { width: min(1000px, 96vw); }
  dialog::backdrop { background: #0006; }
  dialog form, .col { display: flex; flex-direction: column; gap: .7rem; }
  dialog h3 { margin: 0; font-size: 1.5rem; }
  .row, dialog form.row { display: flex; flex-direction: row; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row > input:not([type=color]), .row > label { flex: 1; }
  form.dev { border-top: 2px solid var(--line); padding-top: .6rem; }
  form.dev:first-child { border-top: 0; padding-top: 0; }
  .settings section { border: 2px solid var(--track); border-radius: 18px; padding: .8rem; }
  .settings h4 { margin: 0 0 .5rem; font-size: 1.2rem; }
  input[type=color] { width: 3.2rem; height: 3rem; padding: .2rem; }

  /* 우체통 */
  .mailgrid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 1rem; }
  .chips, .phrases { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip { background: var(--card); color: var(--ink); border: 3px solid var(--line); padding: .5rem .9rem; border-radius: 16px; font-weight: 700; font-size: 1.1rem; }
  .chip.on, .chip:has(input:checked) { border-color: var(--c, var(--ink)); background: color-mix(in srgb, var(--c, var(--ink)) 22%, var(--card)); }
  .chip input { display: none; }
  .phrase { font-size: 1.2rem; padding: .8rem 1rem; }
  .maillist { max-height: 62dvh; overflow: auto; }
  li.mail { display: block; }
  li.mail.unread { background: var(--soft); }
  .mhead { font-size: .8em; color: var(--gray); display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .mtext { font-size: 1.3rem; font-weight: 700; margin: .2rem 0; overflow-wrap: anywhere; }
  .re { font-size: .8em; color: var(--mute); border-left: 3px solid var(--line); padding-left: .5rem; }
  .reads { font-size: .8em; color: #2e9e5b; }
  .quick { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .4rem; }
  .quick button { padding: .45rem .75rem; font-size: 1rem; }

  /* 게시판 상세·알람 */
  .notebig { font-size: 1.8rem; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: var(--cream); border-radius: 18px; }
  .bigdone { font-size: 1.8rem; padding: 1.1rem; background: var(--c); text-shadow: 0 1px 2px #0005; }
  .bigdone.ghost { background: var(--track); text-shadow: none; }
  #alarm { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #000b; padding: 1rem; }
  #alarm .box { background: var(--card); border-radius: 30px; padding: 2rem; text-align: center; width: min(640px, 100%); }
  #alarm .ring { font-size: 5rem; animation: shake .4s infinite; }
  @keyframes shake { 50% { transform: rotate(14deg); } }
</style>
</head>
<body>

<div id="gate" hidden>
  <form id="gateForm" class="card">
    <div class="row"><h1 data-i="title"></h1><button type="button" class="ghost" data-lang style="margin-left:auto"></button></div>
    <p id="gateMsg"></p>
    <input name="name" data-ip="namePh" maxlength="20" required>
    <input name="pin" type="password" inputmode="numeric" pattern="\d{4,8}" data-ip="pinPh" required autocomplete="off">
    <div class="roles" id="roles">
      <label><input type="radio" name="role" value="family" checked><span data-i="roleFamily"></span></label>
      <label><input type="radio" name="role" value="parent"><span data-i="roleParent"></span></label>
    </div>
    <button data-i="start"></button>
  </form>
</div>

<div id="board" hidden style="display:contents">
  <header>
    <div class="when"><div id="date"></div><div id="clock"></div></div>
    <div id="wx"></div>
    <div class="right">
      <span id="mePick"></span><span id="devName"></span>
      <button class="ghost" data-lang></button>
      <button id="openMail"><span data-i="mailbox"></span><b class="badge" id="mailBadge" hidden></b></button>
      <button class="ghost" id="openSettings" data-i="settings" hidden></button>
    </div>
  </header>
  <main>
    <div id="kids"></div>
    <div class="side">
      <section class="card"><h2><span data-i="events"></span><button class="ghost hist" data-calopen>🗓</button><button class="add" data-open="eventDlg">＋</button></h2><ul id="events"></ul></section>
    </div>
  </main>
</div>

<dialog id="eventDlg"><form data-act="addEvent">
  <h3 data-i="addEvent"></h3>
  <input name="title" data-ip="eventPh" maxlength="60" required>
  <div class="row"><input name="date" type="date" required><input name="time" type="time"></div>
  <select name="who" class="whoSel"></select>
  <input name="prep" data-ip="prepPh" maxlength="60">
  <div class="row"><button data-i="add"></button><button type="button" class="ghost" data-close data-i="cancel"></button></div>
</form></dialog>


<dialog id="noteAddDlg"><form data-addnote>
  <h3 data-i="addNote"></h3>
  <textarea name="text" maxlength="200" data-ip="notePh" required></textarea>

const POLL_MS = 10000; // 다른 기기 변경을 확인하는 간격 (작은 버전 값만 확인하고, 바뀌었을 때만 전체를 받음)

async function api(url, data) {
  const r = await fetch(url, data ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : {});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { boot(); throw new Error('unregistered'); }
  if (!r.ok) { if (data) alert(L[lang]['e_' + j.error] || t('e_server_error')); throw new Error(j.error); } // 자동 새로고침 실패는 조용히
  return j;
}
const act = (type, data) => api('/api?r=action', { type, ...data }).then(checkVer);
async function checkVer() { // 바뀐 게 있을 때만 전체를 다시 받음
  const { v } = await (await fetch('/api?r=ver')).json();
  if (v !== lastVer || v == null) { await load(); lastVer = v; }
}

// ---------- 시작: 등록 확인 ----------
let gateMode;
const joinCode = () => new URLSearchParams(location.search).get('join');
async function boot() {
  const me = await (await fetch('/api?r=me')).json();
  if (me.device) return start();
  clearInterval(poll); S = null;
  $('#board').hidden = true; $('#gate').hidden = false;
  gateMode = me.setup ? 'register' : 'setup';
  const join = me.setup && joinCode();
  $('#roles').hidden = gateMode === 'setup' || !!join;
  $('#gateForm').pin.hidden = !!join; $('#gateForm').pin.required = !join;
  $('#gateMsg').dataset.i = join ? 'joinMsg' : gateMode === 'setup' ? 'setupMsg' : 'registerMsg';
  applyLang();
}
$('#gateForm').onsubmit = async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), join = gateMode === 'register' && joinCode();
  if (join) { delete f.pin; delete f.role; f.join = join; }
  const ok = await api('/api?r=' + gateMode, f).then(() => true, () => false);
  if (join && ok) history.replaceState(null, '', '/');
  e.target.pin.value = '';
  boot();
};

async function start() {
  $('#gate').hidden = true; $('#board').hidden = false;
  clearInterval(poll);
  poll = setInterval(() => { if (!document.hidden) checkVer().catch(() => {}); }, POLL_MS);
  lastVer = undefined;
  await checkVer();
  navigator.wakeLock?.request('screen').catch(() => {});
  if (location.search.includes('mail=1')) { history.replaceState(null, '', '/'); openMail(); } // 알림을 눌러서 열었을 때
}
let prevCount = null;
async function load() {
  S = await api('/api?r=state');
  refresh();
  const n = myUnread() + unseenNotes(); // 새 쪽지가 오면 딩동
  if (prevCount != null && n > prevCount) beep(2, 660);

// box가 넘치면 list의 뒤쪽 항목부터 숨기고 "+N개 더" 버튼을 붙임
function fitBox(box, list, items, button) {
  list.querySelector(':scope > .more')?.remove();
  items.forEach((x) => x.hidden = false);
  let n = 0, more = null;
  while (box.scrollHeight > box.clientHeight + 1 && n < items.length) {

    if (!more) { more = document.createElement(list.tagName === 'UL' ? 'li' : 'div'); more.className = 'more'; list.append(more); }
    more.innerHTML = button(t('more').replace('{n}', n));
  }
}

// 할 일이 2줄도 안 보일 만큼 좁으면 일정을 더 줄임. 숨긴 일정은 "+N개 더" → 달력
function fitCard(card) {
  const ag = card.querySelector('.agenda'), todo = card.querySelector('.todo');
  if (ag) {
    const items = [...ag.querySelectorAll('.ag')];
    ag.querySelector(':scope > .more')?.remove();
    items.forEach((x, i) => x.hidden = i >= 2);
    const tight = () => todo && todo.clientHeight < Math.min(todo.scrollHeight, 150) || card.scrollHeight > card.clientHeight + 1;
    let n = items.length - 1;
    while (n >= 0 && (items[n].hidden || tight())) { items[n].hidden = true; n--; if (n >= 0 && !items[n].hidden && !tight()) break; }
    const hid = items.filter((x) => x.hidden).length;
    if (hid) { const more = document.createElement('div'); more.className = 'more'; more.innerHTML = `<button class="ghost" data-calopen>${t('more').replace('{n}', hid)}</button>`; ag.append(more); }
  }

// ---------- 날씨: Open-Meteo, 막히면 MET Norway (둘 다 키 없음). 미세먼지는 Open-Meteo 대기질 ----------
const WX_ICON = { sun: '☀️', partly: '⛅', cloud: '☁️', fog: '🌫', rain: '🌧', snow: '❄️', storm: '⛈' };
const wmo = (c) => c === 0 ? 'sun' : c <= 2 ? 'partly' : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c >= 95 ? 'storm' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow' : 'rain';
const metKind = (s = '') => /thunder/.test(s) ? 'storm' : /snow/.test(s) ? 'snow' : /rain|sleet/.test(s) ? 'rain' : /fog/.test(s) ? 'fog' : /partly|fair/.test(s) ? 'partly' : /cloudy/.test(s) ? 'cloud' : 'sun';
const getJSON = async (u) => { const r = await fetch(u, { signal: AbortSignal.timeout(8000) }); if (!r.ok) throw new Error(r.status); return r.json(); };
async function fromOpenMeteo(p) {
  const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,apparent_temperature,weather_code`
    + '&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2');
  const H = j.hourly, i0 = Math.max(0, H.time.findIndex((x) => x.slice(0, 13) >= j.current.time.slice(0, 13)));
  return { temp: j.current.temperature_2m, feels: j.current.apparent_temperature, kind: wmo(j.current.weather_code),
    min: j.daily.temperature_2m_min[0], max: j.daily.temperature_2m_max[0], src: 'Open-Meteo',
    hours: H.time.slice(i0, i0 + 12).map((x, i) => ({ h: +x.slice(11, 13), temp: H.temperature_2m[i0 + i], kind: wmo(H.weather_code[i0 + i]), pop: H.precipitation_probability[i0 + i] ?? 0 })) };
}
async function fromMet(p) {
  const j = await getJSON(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${p.lat}&lon=${p.lon}`);
  const ts = j.properties.timeseries.filter((x) => Date.parse(x.time) > Date.now() - 3600e3);
  const hours = ts.slice(0, 12).map((x) => ({ h: new Date(x.time).getHours(), temp: x.data.instant.details.air_temperature,
    kind: metKind(x.data.next_1_hours?.summary.symbol_code), pop: (x.data.next_1_hours?.details.precipitation_amount ?? 0) > 0.1 ? 70 : 0 }));
  const day = ts.filter((x) => ymd(new Date(x.time)) === today()).map((x) => x.data.instant.details.air_temperature);
  const temps = day.length ? day : hours.map((h) => h.temp);
  return { temp: hours[0].temp, feels: null, kind: hours[0].kind, min: Math.min(...temps), max: Math.max(...temps), hours, src: 'MET Norway' };
}
async function fromAir(p) {
  const j = await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=pm10,pm2_5`);
  return { pm10: j.current.pm10, pm25: j.current.pm2_5 };
}
let WX = null, AQ = null, wxAt = 0, wxKey = '';
async function loadWeather() {
  const p = S?.place; if (!p) { WX = AQ = null; return renderWx(); }
  const key = p.lat + ',' + p.lon;
  if (key === wxKey && Date.now() - wxAt < 30 * 60e3) return;
  wxKey = key; wxAt = Date.now();
  let w = null;
  for (const src of [fromOpenMeteo, fromMet]) { try { w = await src(p); break; } catch {} } // 막히면 다음 서비스로
  if (w) WX = w; else wxAt = Date.now() - 25 * 60e3; // 둘 다 실패하면 이전 값을 두고 5분 뒤 다시
  AQ = await fromAir(p).catch(() => AQ);
  renderWx();
}
const deg = (c) => Math.round(S.place?.unit === 'F' ? c * 9 / 5 + 32 : c) + '°';
const DUST_COL = ['#2e7ad1', '#2e9e5b', '#e67e22', '#e74c3c'];
const grade = (v, cut) => v == null ? -1 : cut.findIndex((c) => v <= c) === -1 ? 3 : cut.findIndex((c) => v <= c);
function outfit(w, aqLv) {
  const f = w.feels ?? w.temp, i = [28, 23, 20, 17, 12, 9, 5].findIndex((c) => f >= c);
  const tips = [t('wear')[i === -1 ? 7 : i]];
  if (w.max - w.min >= 10) tips.push(t('tipGap'));

let ac;
document.addEventListener('pointerdown', () => { try { ac ||= new AudioContext(); ac.resume(); } catch {} }); // 브라우저는 한 번 터치한 뒤에만 소리를 허용
function beep(times = 3, freq = 880) {
  if (!ac) return;
  for (let i = 0; i < times; i++) {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.3;
    o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.35, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
    o.start(t0); o.stop(t0 + 0.26);
  }
}
// 매일 정한 시각에, 기간 안이고 아직 안 한 아이가 있으면 태블릿에서 알람 (그 아이들 얼굴만 표시)
const rung = new Set(); let alarmTimer = null;
function checkAlarms() {
  if (!S || isParent()) return;
  const hm = new Date().toTimeString().slice(0, 5), td = today();
  for (const n of activeNotes()) {
    if (!n.alarm || n.alarm !== hm || td < n.start || td > n.end || rung.has(n.id + td)) continue;
    rung.add(n.id + td);
    const left = n.to.filter((k) => !n.doneBy[k] && kidOf(k));
    if (!left.length) continue;
    ring(n.text, left.map((k) => `<button class="face big" style="--c:${kidOf(k).color}" data-note="${n.id}:${k}">${esc(kidOf(k).emoji)}<b>${esc(kidOf(k).name)}</b></button>`).join(''));
  }
  // 학원 15분 전: 정확한 분을 놓쳐도(화면 멈춤 등) 5분 안에는 꼭 울림, 휴강이면 안 울림
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
  for (const it of dayItems(td)) {
    if (!it.c || it.off) continue;
    const [h, m] = it.time.split(':').map(Number), at = h * 60 + m - 15, key = `${it.c.id}|${td}|${it.time}`;
    if (mins < at || mins >= at + 5 || rung.has(key)) continue;
    rung.add(key);
    const k = kidOf(it.kid); if (!k) continue;
    ring(`${t('classAlarm').replace('{name}', it.title)}${it.memo ? '\n📝 ' + it.memo : ''}${it.prep ? `\n${t('prep')}: ${it.prep}` : ''}`,
      `<button class="face big" style="--c:${k.color}" data-alarmok>${esc(k.emoji)}<b>${esc(k.name)}</b></button>`);
  }
}
function ring(text, faces) {
  $('#alarmText').textContent = text;
  $('#alarmFaces').innerHTML = faces;
  $('#alarm').hidden = false;
  let n2 = 0; clearInterval(alarmTimer); beep();
  alarmTimer = setInterval(() => { if (++n2 > 30) stopAlarm(); else beep(); }, 2000); // 1분 동안 울림
}

    if ('place' in ds) {
      const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v.q)}&count=1&language=${lang}`).catch(() => ({}));
      const r = g.results?.[0]; if (!r) return alert(t('wxNotFound'));
      await act('setPlace', { name: [r.name, r.admin1].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude, unit: v.unit }); f.reset();
    }
    if (ds.dev) { await act('editDevice', { id: ds.dev, ...v }).finally(() => { f.current.value = ''; }); alert(t('saved')); }
    if ('pin' in ds) { await act('changePin', v); f.reset(); alert(t('pinChanged')); }
    if ('addnote' in ds) {
      if (!fd.getAll('to').length) return alert(t('pickTo'));
      await act('addNote', { ...v, to: fd.getAll('to') }); f.reset(); f.closest('dialog').close();
    }
    if ('mailsend' in ds) { await sendMail(v.text); f.reset(); }
  } catch {}
});

// ---------- 시계 + 자정에 할 일 초기화 + 알람 ----------
function tick() {
  const n = new Date();
  $('#clock').textContent = n.toLocaleTimeString(t('locale'), { hour: 'numeric', minute: '2-digit' });
  $('#date').textContent = n.toLocaleDateString(t('locale'), { month: 'long', day: 'numeric', weekday: 'long' });
  const night = n.getHours() >= 19 || n.getHours() < 6; document.body.classList.toggle('night', night);
  document.querySelector('meta[name=theme-color]').content = night ? '#121327' : '#FFDE59';
  if (S && day !== today()) { day = today(); render(); } // 자정에 할 일 초기화
  checkAlarms();
  if (S) loadWeather();
  if (S?.cal.on && Date.now() - calTry > 30 * 60e3) { calTry = Date.now(); api('/api?r=calsync', {}).catch(() => {}); }
}
let calTry = 0;
setInterval(tick, 5000); applyLang();
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) checkVer().catch(() => {}); });
boot();
</script>
