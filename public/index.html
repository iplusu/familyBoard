<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<link rel="manifest" href="/manifest.json">
<title>Our Family Board</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: #fff6ea; color: #2b2622;
    font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; border: 0; border-radius: 16px; padding: .6rem 1.1rem; background: #2b2622; color: #fff; font-weight: 700; }
  button.ghost { background: #f1e6d8; color: #2b2622; }
  input, select, textarea { padding: .7rem .9rem; border: 2px solid #e2d4c2; border-radius: 14px; background: #fff; min-width: 0; }
  textarea { min-height: 5rem; resize: vertical; }
  [hidden] { display: none !important; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1.2rem; padding: .6rem 1.4rem .4rem; }
  #clock { white-space: nowrap; font-size: clamp(2.4rem, 5vw, 3.6rem); font-weight: 800; letter-spacing: -.02em; }
  #date { font-size: clamp(1.2rem, 2.4vw, 1.8rem); font-weight: 600; color: #7a6b5d; }
  header .right { margin-left: auto; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; color: #9a8b7d; }
  #openMail { font-size: 1.2rem; }
  .badge { display: inline-block; min-width: 1.6em; margin-left: .4em; padding: 0 .45em; border-radius: 99px; background: #e74c3c; color: #fff; font-size: .85em; text-align: center; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 1rem; padding: 0 1rem 1rem; }
  #kids { display: contents; }
  .side { display: grid; grid-template-rows: 1.5fr 1fr .8fr; gap: 1rem; min-height: 0; }
  .card { background: #fff; border-radius: 26px; padding: 1rem 1.1rem; box-shadow: 0 2px 10px #0000000d; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .card h2 { margin: 0 0 .5rem; font-size: clamp(1.3rem, 2.6vw, 1.9rem); display: flex; align-items: center; gap: .5rem; }
  .card h2 .add { margin-left: auto; font-size: 1.6rem; width: 3rem; height: 3rem; padding: 0; border-radius: 50%; flex: none; }
  .card h2 .hist { margin-left: auto; padding: .4rem .7rem; }
  .card h2 .hist ~ .add { margin-left: 0; }
  .parentOnly { display: none !important; }
  body.parent .parentOnly { display: inline-block !important; }

  .kid { border-top: 10px solid var(--c); }
  .kid .emoji { font-size: 1.4em; }
  .kid .count { margin-left: auto; background: var(--c); color: #fff; border-radius: 99px; padding: .1rem .8rem; font-size: .8em; text-shadow: 0 1px 2px #0005; }
  .tasks { flex: 1; display: flex; flex-direction: column; gap: .5rem; }
  .task { flex: 1; min-height: 42px; max-height: 96px; display: flex; align-items: center; gap: .6rem; text-align: left;
    font-size: clamp(1.25rem, 2.4vw, 1.8rem); background: #fff; color: #2b2622; border: 3px solid var(--c); border-radius: 20px; }
  .task.done { background: color-mix(in srgb, var(--c) 28%, #fff); }
  .task.done span { text-decoration: line-through; opacity: .6; }
  .cheer { text-align: center; font-size: 1.6rem; font-weight: 800; margin-top: .6rem; }
  .empty { color: #a99a8b; font-size: 1.2rem; margin: .3rem 0; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
  li { display: flex; align-items: center; gap: .7rem; font-size: clamp(1.05rem, 1.9vw, 1.35rem); padding: .55rem .8rem; border-radius: 16px; background: #faf4ec; }
  li.today { background: #ffe9c7; }
  li .when { font-weight: 800; white-space: nowrap; }
  li .who { margin-left: auto; white-space: nowrap; font-size: .85em; padding: .1rem .6rem; border-radius: 99px; color: #fff; background: var(--c, #8a7a6a); }
  li .x, .x { display: none; background: none; color: #c0392b; padding: .2rem .5rem; font-size: 1.3rem; }
  body.parent li .x, .settings .x { display: inline-block; }

  /* 얼굴 버튼 (게시판·우체통) */
  .face { position: relative; width: 3rem; height: 3rem; padding: 0; border-radius: 50%; font-size: 1.6rem; line-height: 1; background: #fff; color: #2b2622; border: 3px solid var(--c, #8a7a6a); flex: none; }
  .face.done { background: color-mix(in srgb, var(--c) 30%, #fff); }
  .face.done::after { content: '✓'; position: absolute; right: -6px; bottom: -6px; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: #2e9e5b; color: #fff; font-size: .85rem; line-height: 1.3rem; }
  .face .dot { position: absolute; top: -3px; right: -3px; width: .85rem; height: .85rem; border-radius: 50%; background: #e74c3c; }
  .face.big { width: auto; height: auto; min-width: 9rem; padding: 1rem 1.4rem; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: .3rem; font-size: 3.2rem; }
  .face.big b { font-size: 1.4rem; }
  .face.big .badge { position: absolute; top: -.5rem; right: -.5rem; font-size: 1.1rem; }
  .faces { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

  li.note { display: grid; grid-template-columns: 1fr auto auto; gap: .6rem; }
  li.note .ntext { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nmeta { font-size: .8em; color: #7a6b5d; }
  li.note.over .nmeta { color: #c0392b; font-weight: 700; }
  li.note.future { opacity: .55; }
  .nfaces { display: flex; gap: .45rem; }

  /* 폰·세로 화면: 한 줄로 쌓고 스크롤 */
  @media (max-width: 820px), (orientation: portrait) {
    body { height: auto; min-height: 100dvh; }
    main { grid-template-columns: 1fr; }
    .side { grid-template-rows: auto; }
    .task { flex: none; }
    .mailgrid { grid-template-columns: 1fr !important; }
  }

  #gate { flex: 1; display: grid; place-items: center; padding: 1rem; }
  #gate form { width: min(440px, 100%); gap: .8rem; }
  #gate h1 { margin: 0; font-size: 2rem; }
  .roles { display: flex; gap: .6rem; }
  .roles label { flex: 1; padding: .7rem; border: 2px solid #e2d4c2; border-radius: 14px; text-align: center; font-weight: 600; }
  .roles label:has(input:checked) { border-color: #2b2622; background: #f1e6d8; }
  .roles input { display: none; }

  dialog { border: 0; border-radius: 24px; padding: 1.2rem; width: min(560px, 94vw); max-height: 92dvh; box-shadow: 0 10px 40px #0004; }
  dialog.wide { width: min(1000px, 96vw); }
  dialog::backdrop { background: #0006; }
  dialog form, .col { display: flex; flex-direction: column; gap: .7rem; }
  dialog h3 { margin: 0; font-size: 1.5rem; }
  .row, dialog form.row { display: flex; flex-direction: row; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row > input:not([type=color]), .row > label { flex: 1; }
  .settings section { border: 2px solid #f1e6d8; border-radius: 18px; padding: .8rem; }
  .settings h4 { margin: 0 0 .5rem; font-size: 1.2rem; }
  input[type=color] { width: 3.2rem; height: 3rem; padding: .2rem; }

  /* 우체통 */
  .mailgrid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 1rem; }
  .chips, .phrases { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip { background: #fff; color: #2b2622; border: 3px solid #e2d4c2; padding: .5rem .9rem; border-radius: 16px; font-weight: 700; font-size: 1.1rem; }
  .chip.on, .chip:has(input:checked) { border-color: var(--c, #2b2622); background: color-mix(in srgb, var(--c, #2b2622) 22%, #fff); }
  .chip input { display: none; }
  .phrase { font-size: 1.2rem; padding: .8rem 1rem; }
  .maillist { max-height: 62dvh; overflow: auto; }
  li.mail { display: block; }
  li.mail.unread { background: #ffe9c7; }
  .mhead { font-size: .8em; color: #7a6b5d; display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .mtext { font-size: 1.3rem; font-weight: 700; margin: .2rem 0; overflow-wrap: anywhere; }
  .re { font-size: .8em; color: #9a8b7d; border-left: 3px solid #e2d4c2; padding-left: .5rem; }
  .reads { font-size: .8em; color: #2e9e5b; }
  .quick { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .4rem; }
  .quick button { padding: .45rem .75rem; font-size: 1rem; }

  /* 게시판 상세·알람 */
  .notebig { font-size: 1.8rem; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #faf4ec; border-radius: 18px; }
  .bigdone { font-size: 1.8rem; padding: 1.1rem; background: var(--c); text-shadow: 0 1px 2px #0005; }
  .bigdone.ghost { background: #f1e6d8; text-shadow: none; }
  #alarm { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #000b; padding: 1rem; }
  #alarm .box { background: #fff; border-radius: 30px; padding: 2rem; text-align: center; width: min(640px, 100%); }
  #alarm .ring { font-size: 5rem; animation: shake .4s infinite; }
  @keyframes shake { 50% { transform: rotate(14deg); } }
</style>
</head>
<body>

<div id="gate" hidden>
  <form id="gateForm" class="card">
    <div class="row"><h1 data-i="title"></h1><button type="button" class="ghost" data-lang style="margin-left:auto"></button></div>
    <p id="gateMsg"></p>
    <input name="name" data-ip="namePh" maxlength="20" required>
    <input name="pin" type="password" inputmode="numeric" pattern="\d{4,8}" data-ip="pinPh" required autocomplete="off">
    <div class="roles" id="roles">
      <label><input type="radio" name="role" value="family" checked><span data-i="roleFamily"></span></label>
      <label><input type="radio" name="role" value="parent"><span data-i="roleParent"></span></label>
    </div>
    <button data-i="start"></button>
  </form>
</div>

<div id="board" hidden style="display:contents">
  <header>
    <div id="clock"></div><div id="date"></div>
    <div class="right">
      <span id="mePick"></span><span id="devName"></span>
      <button class="ghost" data-lang></button>
      <button id="openMail"><span data-i="mailbox"></span><b class="badge" id="mailBadge" hidden></b></button>
      <button class="ghost" id="openSettings" data-i="settings" hidden></button>
    </div>
  </header>
  <main>
    <div id="kids"></div>
    <div class="side">
      <section class="card"><h2><span data-i="boardTitle"></span><button class="ghost hist" data-hist>📜</button><button class="add parentOnly" data-open="noteAddDlg">＋</button></h2><ul id="notes"></ul></section>
      <section class="card"><h2><span data-i="events"></span> <button class="add" data-open="eventDlg">＋</button></h2><ul id="events"></ul></section>
      <section class="card"><h2><span data-i="memos"></span> <button class="add" data-open="memoDlg">＋</button></h2><ul id="memos"></ul></section>
    </div>
  </main>
</div>

<dialog id="eventDlg"><form data-act="addEvent">
  <h3 data-i="addEvent"></h3>
  <input name="title" data-ip="eventPh" maxlength="60" required>
  <div class="row"><input name="date" type="date" required><input name="time" type="time"></div>
  <select name="who" class="whoSel"></select>
  <div class="row"><button data-i="add"></button><button type="button" class="ghost" data-close data-i="cancel"></button></div>
</form></dialog>

<dialog id="memoDlg"><form data-act="addMemo">
  <h3 data-i="addMemo"></h3>
  <input name="text" data-ip="memoPh" maxlength="200" required>
  <select name="who" class="whoSel"></select>
  <div class="row"><button data-i="post"></button><button type="button" class="ghost" data-close data-i="cancel"></button></div>
</form></dialog>

<dialog id="noteAddDlg"><form data-addnote>
  <h3 data-i="addNote"></h3>
  <textarea name="text" maxlength="200" data-ip="notePh" required></textarea>
  <div class="chips" id="noteKids"></div>
  <div class="row">
    <label class="col"><span data-i="startDate"></span><input name="start" type="date" required></label>
    <label class="col"><span data-i="endDate"></span><input name="end" type="date" required></label>
  </div>
  <label class="col"><span data-i="alarmTime"></span><input name="alarm" type="time"></label>
  <div class="row"><button data-i="post"></button><button type="button" class="ghost" data-close data-i="cancel"></button></div>
</form></dialog>

<dialog id="noteDlg"><div class="col" id="noteBody"></div></dialog>

<dialog id="histDlg" class="wide"><div class="col">
  <div class="row"><h3 data-i="history"></h3><button type="button" class="ghost" data-close style="margin-left:auto" data-i="close"></button></div>
  <ul id="histList"></ul>
</div></dialog>

<dialog id="mailDlg" class="wide"><div class="col">
  <div class="row"><h3 data-i="mailbox"></h3><span id="mailTop" class="row"></span><button type="button" class="ghost" data-close style="margin-left:auto" data-i="close"></button></div>
  <div id="mailBody" class="col"></div>
</div></dialog>

<dialog id="settingsDlg"><div class="col settings">
  <div class="row"><h3 data-i="settingsTitle"></h3><button type="button" class="ghost" data-close style="margin-left:auto" data-i="close"></button></div>
  <div id="settingsBody" class="col"></div>
</div></dialog>

<div id="alarm" hidden><div class="box col">
  <div class="ring">⏰</div>
  <div class="notebig" id="alarmText"></div>
  <div class="faces" id="alarmFaces"></div>
  <button data-alarmok data-i="alarmOk"></button>
</div></div>

async function api(url, data) {
  const r = await fetch(url, data ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : {});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { boot(); throw new Error('unregistered'); }
  if (!r.ok) { if (data) alert(L[lang]['e_' + j.error] || t('e_server_error')); throw new Error(j.error); } // 자동 새로고침 실패는 조용히
  return j;
}
const act = (type, data) => api('/api?r=action', { type, ...data }).then(checkVer);
async function checkVer() { // 바뀐 게 있을 때만 전체를 다시 받음
  const { v } = await (await fetch('/api?r=ver')).json();
  if (v !== lastVer || v == null) { await load(); lastVer = v; }
}

async function enablePush() { // 부모 폰 알림 켜기
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !window.Notification) return alert(t('notifUnsupported'));
  if (await Notification.requestPermission() !== 'granted') return alert(t('notifDenied'));
  const reg = await navigator.serviceWorker.register('/sw.js');

  const key = Uint8Array.from(atob(S.vapid.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
  await act('subscribe', { endpoint: sub.endpoint, lang });
  alert(t('notifReady'));

// ---------- 소리 (태블릿 알람·새 쪽지) ----------
let ac;
document.addEventListener('pointerdown', () => { try { ac ||= new AudioContext(); ac.resume(); } catch {} }); // 브라우저는 한 번 터치한 뒤에만 소리를 허용
function beep(times = 3, freq = 880) {
  if (!ac) return;
  for (let i = 0; i < times; i++) {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.3;
    o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.35, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
    o.start(t0); o.stop(t0 + 0.26);
  }
}
// 매일 정한 시각에, 기간 안이고 아직 안 한 아이가 있으면 태블릿에서 알람 (그 아이들 얼굴만 표시)
const rung = new Set(); let alarmTimer = null;
function checkAlarms() {
  if (!S || isParent()) return;
  const hm = new Date().toTimeString().slice(0, 5), td = today();
  for (const n of activeNotes()) {
    if (!n.alarm || n.alarm !== hm || td < n.start || td > n.end || rung.has(n.id + td)) continue;
    rung.add(n.id + td);
    const left = n.to.filter((k) => !n.doneBy[k] && kidOf(k));
    if (!left.length) continue;
    $('#alarmText').textContent = n.text;
    $('#alarmFaces').innerHTML = left.map((k) => `<button class="face big" style="--c:${kidOf(k).color}" data-note="${n.id}:${k}">${esc(kidOf(k).emoji)}<b>${esc(kidOf(k).name)}</b></button>`).join('');
    $('#alarm').hidden = false;
    let n2 = 0; clearInterval(alarmTimer); beep();
    alarmTimer = setInterval(() => { if (++n2 > 30) stopAlarm(); else beep(); }, 2000); // 1분 동안 울림
  }
}

  try {
    if (d.toggle) { const [kidId, taskId] = d.toggle.split(':'); await act('toggle', { kidId, taskId, date: today() }); }
    if (d.del) { const [type, id] = d.del.split(':'); if (confirm(t('confirmDel'))) await act(type, { id }); }
    if (d.open) {
      const dlg = $('#' + d.open);

        if (!S.me.member) return alert(t('e_need_member'));
        $('#noteKids').innerHTML = S.kids.map((k) => `<label class="chip" style="--c:${k.color}"><input type="checkbox" name="to" value="${k.id}" checked>${esc(k.emoji)} ${esc(k.name)}</label>`).join('');

      }
      dlg.querySelectorAll('.whoSel').forEach((s) => s.innerHTML = whoList().map((w) => `<option>${esc(w)}</option>`).join(''));
      if (dlg.querySelector('[name=date]')) dlg.querySelector('[name=date]').value = today();
      dlg.showModal();
    }
    if (d.close !== undefined) b.closest('dialog').close();
    if (d.lang !== undefined) { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('lang', lang); } catch {} applyLang(); }
    if (b.id === 'openSettings') { renderSettings(); $('#settingsDlg').showModal(); }
    if (b.id === 'openMail') openMail();
    if (d.deltask) { const [kidId, taskId] = d.deltask.split(':'); if (confirm(t('confirmTask'))) await act('delTask', { kidId, taskId }); }
    if (d.deldev && confirm(t('confirmDev'))) await act('delDevice', { id: d.deldev });
    if (d.setme) await act('setMe', { member: d.setme });
    // 게시판
    if (d.note) { stopAlarm(); const [id, kid] = d.note.split(':'); openNote(id, kid); }
    if (d.done) {
      const [id, kid] = d.done.split(':');
      await act('doneNote', { id, kid });
      if (S.board.find((n) => n.id === id)?.doneBy[kid]) { beep(3, 1180); $('#noteDlg').close(); }
    }
    if (d.hist !== undefined) { renderHist(); $('#histDlg').showModal(); }
    if (d.alarmok !== undefined) stopAlarm();
    // 우체통
    if (d.mailwho) { mailWho = d.mailwho; mailTo = new Set(PARENTS); renderMail(); }
    if (d.mailback !== undefined) { mailWho = null; renderMail(); }
    if (d.to) {
      const opts = [...PARENTS, ...S.kids.map((k) => k.id)].filter((m) => m !== mailWho);
      if (d.to === '*') mailTo = opts.every((m) => mailTo.has(m)) ? new Set() : new Set(opts);
      else mailTo.has(d.to) ? mailTo.delete(d.to) : mailTo.add(d.to);
      renderToChips();
    }
    if (d.phrase) await sendMail(d.phrase);
    if (d.reply) { const m = S.mail.find((x) => x.id === d.reply); await sendMail(d.txt, [m.from], m.id); }
    if (d.push !== undefined) await enablePush();
  } catch {} // 오류 안내는 api()에서
});
document.addEventListener('submit', async (e) => {
  const f = e.target, ds = f.dataset, fd = new FormData(f), v = Object.fromEntries(fd);
  if (f.id === 'gateForm') return;
  e.preventDefault();
  try {
    if (ds.act) { await act(ds.act, v); f.reset(); f.closest('dialog').close(); }
    if (ds.kid) await act('saveKid', { id: ds.kid, ...v });
    if (ds.addtask) await act('addTask', { kidId: ds.addtask, ...v });
    if ('pin' in ds) { await act('changePin', v); f.reset(); alert(t('pinChanged')); }
    if ('addnote' in ds) {
      if (!fd.getAll('to').length) return alert(t('pickTo'));
      await act('addNote', { ...v, to: fd.getAll('to') }); f.reset(); f.closest('dialog').close();
    }
    if ('mailsend' in ds) { await sendMail(v.text); f.reset(); }
  } catch {}
});

// ---------- 시계 + 자정에 할 일 초기화 + 알람 ----------
function tick() {
  const n = new Date();
  $('#clock').textContent = n.toLocaleTimeString(t('locale'), { hour: 'numeric', minute: '2-digit' });
  $('#date').textContent = n.toLocaleDateString(t('locale'), { month: 'long', day: 'numeric', weekday: 'long' });
  if (S && day !== today()) { day = today(); render(); }
  checkAlarms();
}
setInterval(tick, 5000); applyLang();
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) checkVer().catch(() => {}); });
boot();
</script>
